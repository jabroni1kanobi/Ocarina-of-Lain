name: Other bug
description: Input, sound, saves, settings or anything else that does not work as on the console.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The title line of the settings menu (F1).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: GPU, Windows version, and the controller if it is an input problem.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag `logs\nx2navi.log` from the game's folder into this field.
