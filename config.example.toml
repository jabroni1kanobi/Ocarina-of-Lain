# Copy to config.local.toml (ignored by git) and point it at your own files.

[input]
# The base game, dumped from your own console as NSP or XCI.
base = 'C:\Games\NX2navi\base.nsp'
# The update NSP, identified by its code hash; 1.1.1 is supported.
# Leave the list empty to build the base version.
updates = ['C:\Games\NX2navi\update-1.1.1.nsp']
# Keys dumped from your own console. Never printed or copied by the tools.
keys = 'C:\Switch\prod.keys'
# Optional: a firmware NCA directory (an unpacked firmware, or an emulator's installed registered/ directory).
# tools/extract_fonts.py takes the system shared fonts from it; the game needs them only with Chinese or Korean text.
# The installer asks for the same folder (--firmware) when the language needs those fonts.
# firmware = 'C:\Switch\firmware'

[work]
# Extracted files, generated C and builds go here. Allow about 60 GB.
dir = 'build'
